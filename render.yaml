services:
  - type: web
    name: swiming-backend
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: python BackEnd/manage.py migrate && python BackEnd/manage.py collectstatic --noinput && gunicorn BackEnd.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      SECRET_KEY:
        generateValue: true
      DEBUG: false
      ALLOWED_HOSTS: swiming-backend.onrender.com
      DB_NAME:
        fromSecret: db_name
      DB_USER:
        fromSecret: db_user
      DB_PASSWORD:
        fromSecret: db_password
      DB_HOST:
        fromSecret: db_host
      DB_PORT:
        fromSecret: db_port
      CLOUDINARY_CLOUD_NAME:
        fromSecret: cloudinary_cloud_name
      CLOUDINARY_API_KEY:
        fromSecret: cloudinary_api_key
      CLOUDINARY_API_SECRET:
        fromSecret: cloudinary_api_secret
      CORS_ALLOWED_ORIGINS: https://www.sorithya.com