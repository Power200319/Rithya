services:
  - type: web
    name: swiming-backend
    runtime: python3
    rootDir: BackEnd
    buildCommand: pip install -r ../requirements.txt
    startCommand: python manage.py migrate && python manage.py collectstatic --noinput && gunicorn BackEnd.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: swiming-backend.onrender.com
      - key: DB_NAME
        fromSecret: db_name
      - key: DB_USER
        fromSecret: db_user
      - key: DB_PASSWORD
        fromSecret: db_password
      - key: DB_HOST
        fromSecret: db_host
      - key: DB_PORT
        fromSecret: db_port
      - key: CLOUDINARY_CLOUD_NAME
        fromSecret: cloudinary_cloud_name
      - key: CLOUDINARY_API_KEY
        fromSecret: cloudinary_api_key
      - key: CLOUDINARY_API_SECRET
        fromSecret: cloudinary_api_secret
      - key: CORS_ALLOWED_ORIGINS
        value: https://www.sorithya.com